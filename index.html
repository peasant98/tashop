<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tashop Crafts</title>
<meta name="description" content="Unique handmade jewelry designed by Tash, California.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a jeweler's tray — masthead, category tabs, then an even grid of pieces on pearl-grey; teal ink with a marigold accent */
:root{
  --bg:#f1f0ee; --card:#ffffff; --ink:#123c3a; --muted:#5b6f6c; --line:#dcdedb;
  --accent:#d98e1f; --sold:#9a3b2f;
  --display:"Italiana","Didot","Bodoni 72",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1918; --card:#172321; --ink:#e3ece9; --muted:#97aba6; --line:#26332f; --accent:#f0a93a; --sold:#e07a69; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1918; --card:#172321; --ink:#e3ece9; --muted:#97aba6; --line:#26332f; --accent:#f0a93a; --sold:#e07a69; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);padding-inline:16px;padding-block:0 56px}
img{max-width:100%;display:block}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto}
header{padding-block:44px 20px;display:grid;gap:10px;justify-items:start}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,9vw,84px);line-height:.95;margin:0;letter-spacing:.01em}
.lede{max-width:52ch;color:var(--muted);margin:0}
.lede a{color:var(--ink)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line)}
nav button{font:500 14px var(--body);color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav .count{margin-left:auto;align-self:center;font-size:13px;color:var(--muted)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:22px;margin-top:22px}
.piece{display:grid;grid-template-rows:auto 1fr;background:var(--card);border-radius:4px;overflow:hidden}
.ph{position:relative;aspect-ratio:4/5;background:var(--line);cursor:zoom-in;border:0;padding:0;width:100%}
.ph img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;background:var(--card);color:var(--sold);padding:3px 8px;border-radius:2px}
.info{padding:14px 14px 16px;display:grid;gap:6px;align-content:start}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:600;margin:0;font-size:16px}
.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.desc{margin:0;font-size:14px;color:var(--muted)}
.buy{margin-top:8px;display:inline-flex;justify-content:center;align-items:center;gap:6px;text-decoration:none;font:600 14px var(--body);padding:10px 12px;border-radius:3px;background:var(--ink);color:var(--bg)}
.buy.ask{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.buy.sold{background:none;color:var(--muted);border:1.5px dashed var(--line);pointer-events:none}
.piece.is-sold img{filter:grayscale(.7);opacity:.75}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 24px;color:var(--muted);font-size:14px}
footer a{color:var(--ink)}
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,720px)}
dialog::backdrop{background:rgba(8,16,15,.82)}
dialog img{max-height:86vh;width:auto;margin:auto;border-radius:3px}
dialog p{color:#fff;text-align:center;margin:10px 0 0;font-family:var(--display);font-size:24px}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:12px}.info{padding:10px}.name{font-size:14px}.desc{font-size:12.5px}.buy{font-size:12.5px;padding:8px}}
@media (prefers-reduced-motion:no-preference){.ph img{transition:transform .35s}.ph:hover img{transform:scale(1.03)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Handmade in California</span>
    <h1>Tashop Crafts</h1>
    <p class="lede">Unique handmade jewelry designed by Tash. Every piece is one of a kind or made in small runs. Follow along at <a href="https://www.instagram.com/tashop_crafts/" target="_blank" rel="noopener">@tashop_crafts</a>.</p>
  </header>
  <nav aria-label="Categories">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="earrings" aria-pressed="false">Earrings</button>
    <button data-f="bracelets" aria-pressed="false">Bracelets</button>
    <button data-f="necklaces" aria-pressed="false">Necklaces</button>
    <span class="count" id="count"></span>
  </nav>
  <main class="grid" id="grid"></main>
  <footer>
    <span>Payments are processed securely by Stripe.</span>
    <span>Custom orders and questions: DM <a href="https://ig.me/m/tashop_crafts" target="_blank" rel="noopener">@tashop_crafts</a></span>
  </footer>
</div>
<dialog id="lb"><img id="lbImg" alt=""><p id="lbCap"></p></dialog>
<script src="products.js"></script>
<script>
const grid=document.getElementById("grid"),count=document.getElementById("count"),lb=document.getElementById("lb");
const DM="https://ig.me/m/tashop_crafts";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(p){
  const sold=p.status==="sold", live=!sold&&p.stripe&&p.price!=null;
  const btn=sold?`<span class="buy sold">Sold</span>`
    :live?`<a class="buy" href="${esc(p.stripe)}" target="_blank" rel="noopener">Buy · $${p.price}</a>`
    :`<a class="buy ask" href="${DM}" target="_blank" rel="noopener">Ask Tash about this</a>`;
  return `<article class="piece${sold?" is-sold":""}">
    <button class="ph" data-id="${p.id}" aria-label="Enlarge ${esc(p.name)}"><img src="img/${p.id}.jpg" alt="${esc(p.name)}" loading="lazy">${sold?'<span class="badge">Sold</span>':""}</button>
    <div class="info"><div class="row"><h2 class="name">${esc(p.name)}</h2>${p.price!=null&&!sold?`<span class="price">$${p.price}</span>`:""}</div>
    <p class="desc">${esc(p.desc)}</p>${btn}</div></article>`;
}
function render(f){
  const list=PRODUCTS.filter(p=>f==="all"||p.type===f).sort((a,b)=>(a.status==="sold")-(b.status==="sold"));
  grid.innerHTML=list.map(card).join("");
  count.textContent=`${list.filter(p=>p.status!=="sold").length} pieces`;
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-pressed",x===b));render(b.dataset.f);
});
grid.addEventListener("click",e=>{
  const b=e.target.closest(".ph");if(!b)return;const p=PRODUCTS.find(x=>x.id===b.dataset.id);
  document.getElementById("lbImg").src=`img/${p.id}.jpg`;document.getElementById("lbImg").alt=p.name;
  document.getElementById("lbCap").textContent=p.name;lb.showModal();
});
lb.addEventListener("click",()=>lb.close());
render("all");
</script>
</body>
</html>
